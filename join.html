<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151229">
<title>انضمام للغرفة — شكون المحتال؟</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta property="og:title" content="تعال نلعبو شكون المحتال؟ 🕵️">
<meta property="og:description" content="اضغط باش تدخل للغرفة">
<style>
@font-face{font-family:"Cairo";src:url("cairo-arabic.woff2") format("woff2"),url("fonts/cairo-arabic.woff2") format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:#f4f1ff;background:radial-gradient(120% 70% at 50% -10%,#3a2b80 0%,#151229 60%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
img{width:110px;height:110px;border-radius:30px;box-shadow:0 12px 30px #0007;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
h1{margin:0;font-size:26px;font-weight:900}
h1 span{color:#ffcf3f}
.code{font-size:22px;font-weight:900;color:#ffcf3f;direction:ltr}
.small{color:#a59fcf;font-size:14px;line-height:1.8}
a.btn{display:block;width:100%;padding:15px;border-radius:18px;font-size:18px;font-weight:900;text-decoration:none;background:#ffcf3f;color:#1a1530;box-shadow:0 6px 0 #b08a12}
a.btn.ghost{background:#2a2352;color:#f4f1ff;box-shadow:0 6px 0 #120f26}
.err{color:#ff8da0;font-weight:800}
</style>
</head>
<body>
<div class="box" id="box">
  <img src="icon.svg" alt="">
  <h1>شكون <span>المحتال؟</span></h1>
  <div id="msg" class="small">⏳ نفتحو الغرفة…</div>
</div>
<script>
// رابط الدعوة: join.html?r=IP[:منفذ]&h=منفذ_الصفحة&n=اسم_القائد
(function(){
  var q = new URLSearchParams(location.search);
  var r = (q.get("r") || "").replace(/[^\w.\-:]/g, "");
  var h = (q.get("h") || "47880").replace(/\D/g, "") || "47880";
  var n = (q.get("n") || "").slice(0, 14);
  var box = document.getElementById("box"), msg = document.getElementById("msg");
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  if(!r){ msg.innerHTML = '<span class="err">الرابط ناقص 😕</span><br>اطلب من القائد يبعثلك رابط جديد'; return; }
  var ip = r.split(":")[0];
  var web = "http://" + ip + ":" + h + "/";
  var app = "intent://join?r=" + encodeURIComponent(r) + "&h=" + h + "#Intent;scheme=mohtal;package=com.chakerred.mohtal;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  var android = /Android/i.test(navigator.userAgent);
  msg.innerHTML = (n ? "👑 " + esc(n) + " يعيّطلك للغرفة<br>" : "") + 'رمز الغرفة: <span class="code">' + esc(r) + '</span>';
  var html = "";
  if(android) html += '<a class="btn" href="' + esc(app) + '">📱 افتح في التطبيق</a>';
  html += '<a class="btn ' + (android ? "ghost" : "") + '" href="' + esc(web) + '">🌐 ادخل من المتصفح</a>';
  html += '<div class="small">لازم تكون في نفس الواي فاي تاع القائد<br>(ولا متصل بنقطة الاتصال تاعو)</div>';
  box.insertAdjacentHTML("beforeend", html);
  // نفتحو مباشرة: أندرويد → التطبيق (ولا المتصفح إذا ما كانش)، آيفون → المتصفح
  setTimeout(function(){ location.href = android ? app : web; }, 700);
})();
</script>
</body>
</html>
