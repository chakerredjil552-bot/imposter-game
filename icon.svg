<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="15%" r="100%">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.5" stop-color="#5b3df5"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#f08a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a0f4a" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="268" r="150" fill="url(#glow)"/>
  <g font-family="Segoe UI, Noto Sans Arabic, Tahoma, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="150" font-size="112" fill="#ffffff" filter="url(#sh)">مين</text>
    <!-- علامة الاستفهام بين الكلمتين، بعمق ثلاثي الأبعاد -->
    <text x="268" y="372" font-size="250" fill="#5a2a05" opacity=".55">؟</text>
    <text x="264" y="368" font-size="250" fill="#a8560a">؟</text>
    <text x="261" y="365" font-size="250" fill="#cf730c">؟</text>
    <text x="258" y="362" font-size="250" fill="url(#gold)" filter="url(#sh)">؟</text>
    <text x="256" y="462" font-size="100" fill="#ffffff" filter="url(#sh)">المحتال</text>
  </g>
</svg>
